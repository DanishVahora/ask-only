<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- AskOnly: a sheet, blacked out except for the one line the question needed.
       Drawn from docs/brand/askonly-favicon-90.png. On a dark tab strip an ink sheet
       would disappear, so there it sits on a tile of the page's cream. -->
  <style>
    .dark { display: none }
    @media (prefers-color-scheme: dark) { .light { display: none } .dark { display: inline } }
  </style>
  <g class="light">
    <path fill="#1b1a16" d="M216 51H808A51 51 0 0 1 859 102V820.3L706.3 973H216A51 51 0 0 1 165 922V102A51 51 0 0 1 216 51Z"/>
    <rect x="253" y="443" width="518" height="138" rx="69" fill="#ffd447"/>
  </g>
  <g class="dark">
    <rect width="1024" height="1024" rx="224" fill="#f4f2e9"/>
    <g transform="translate(512 512) scale(.76) translate(-512 -512)">
      <path fill="#1b1a16" d="M216 51H808A51 51 0 0 1 859 102V820.3L706.3 973H216A51 51 0 0 1 165 922V102A51 51 0 0 1 216 51Z"/>
      <rect x="253" y="443" width="518" height="138" rx="69" fill="#ffd447"/>
    </g>
  </g>
</svg>
